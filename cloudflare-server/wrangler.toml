# EchoStudio storage server: login (Google), and a private file store per user on Cloudflare R2.
# Deployed by .github/workflows/deploy-server.yml. The three values below that are empty are filled in there
# from GitHub repository variables, so nothing personal is stored in this file.
name = "echostudio-server"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "echostudio-audio"

# Live rooms: one Durable Object per room, and one for the peer-to-peer go-between
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "SIGNALING"
class_name = "Signaling"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Signaling"]

# The shared folder of the live rooms is cleaned once an hour (what is a day old goes)
[triggers]
crons = ["23 * * * *"]

[vars]
# the Google OAuth client id of the app (same one the app uses to log in)
GOOGLE_CLIENT_ID = ""
# who may sign in: Google account emails, separated by commas
ALLOWED_EMAILS = ""
# which websites may talk to this server, separated by commas
ALLOWED_ORIGINS = "https://echo-says-echo.pages.dev"
